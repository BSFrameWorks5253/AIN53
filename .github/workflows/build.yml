name: Build and Publish Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build Windows App
      run: |
        python bundle_win.py

    - name: Find Installer Executable
      id: find_exe
      shell: bash
      run: |
        EXE_PATH=$(find "_All Builds" -name "AIN53_Data_Management_Setup.exe" | head -n 1)
        echo "EXE_PATH=$EXE_PATH" >> $GITHUB_ENV

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIN53-Data-Management-Windows
        path: ${{ env.EXE_PATH }}
        if-no-files-found: error

    - name: Create GitHub Release & Upload EXE Asset
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ${{ env.EXE_PATH }}
          version.txt
        generate_release_notes: true

